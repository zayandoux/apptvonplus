<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Discografia</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input, textarea { display: block; margin-bottom: 10px; width: 100%; padding: 8px; }
        .version-box { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
        button { cursor: pointer; padding: 10px; }
    </style>
</head>
<body>

    <h1>Painel de Controle: Discografia</h1>
    
    <div class="card">
        <h3>Adicionar Novo Álbum</h3>
        <input type="number" id="albPosition" placeholder="Posição (ex: 1, 2, 3)">
        <input type="text" id="albID" placeholder="ID (ex: britney-spears)">
        <input type="text" id="albFolder" placeholder="Pasta">
        <input type="text" id="albTitle" placeholder="Título">
        <input type="text" id="albArtist" placeholder="Artista">
        <input type="text" id="albYear" placeholder="Ano">
        <input type="text" id="albCover" placeholder="Capa (ex: capa.jpg)">
        <input type="text" id="albVideo" placeholder="Vídeo (opcional)">
        
        <input type="number" id="numTracks" placeholder="Quantidade de Músicas" onchange="createTrackInputs()">
        <div id="trackInputs"></div>
        
        <button onclick="addAlbum()">Adicionar ao Gerador</button>
    </div>

    <div class="card">
        <button onclick="generateCode()" style="background: green; color: white;">Gerar Código Final (HTML)</button>
        <textarea id="output" rows="10" placeholder="O código gerado aparecerá aqui..."></textarea>
    </div>

    <script>
        let albunsLista = [];

        function createTrackInputs() {
            const num = document.getElementById('numTracks').value;
            const container = document.getElementById('trackInputs');
            container.innerHTML = '';
            for(let i=1; i<=num; i++) {
                container.innerHTML += `
                    <div>
                        <span>${i}</span>
                        <input type="text" class="trackTitle" placeholder="Nome da música">
                        <input type="text" class="trackFile" placeholder="Nome do arquivo.mp3">
                    </div>`;
            }
        }

        function addAlbum() {
            const num = document.getElementById('numTracks').value;
            let tracks = [];
            document.querySelectorAll('#trackInputs > div').forEach((div, idx) => {
                tracks.push({
                    num: (idx + 1).toString(),
                    title: div.querySelector('.trackTitle').value,
                    file: div.querySelector('.trackFile').value
                });
            });

            const novoAlbum = {
                id: document.getElementById('albID').value,
                folder: document.getElementById('albFolder').value,
                title: document.getElementById('albTitle').value,
                artist: document.getElementById('albArtist').value,
                year: document.getElementById('albYear').value,
                cover: document.getElementById('albCover').value,
                video: document.getElementById('albVideo').value,
                tracks: tracks
            };

            albunsLista.push(novoAlbum);
            alert("Álbum adicionado ao rascunho!");
        }

        function generateCode() {
            // Aqui ele gera o formato do array que seu index.html usa
            const jsonCode = JSON.stringify(albunsLista, null, 4);
            const finalHTML = `const albums = ${jsonCode};`;
            document.getElementById('output').value = finalHTML;
        }
    </script>
</body>
</html>
