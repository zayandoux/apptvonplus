<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Discografia - Importador</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; }
        input { display: block; margin-bottom: 10px; width: 100%; padding: 8px; }
        button { cursor: pointer; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Gerador de Discografia</h1>

    <div class="card">
        <h3>1. Importar index.html atual</h3>
        <textarea id="importCode" placeholder="Cole aqui o conteúdo do seu index.html"></textarea>
        <button onclick="importarDados()">Carregar Dados</button>
    </div>

    <div class="card">
        <h3>2. Editor de Álbuns</h3>
        <div id="listaAlbunsEditavel"></div>
    </div>

    <script>
        let dadosDiscografia = [];

        function importarDados() {
            const rawCode = document.getElementById('importCode').value;
            // Usa Regex para capturar o conteúdo dentro de "const albums = [...]"
            const match = rawCode.match(/const\s+albums\s*=\s*(\[[\s\S]*?\]);/);
            
            if (match) {
                try {
                    // Limpa a string para transformar em JSON válido
                    let jsonString = match[1];
                    dadosDiscografia = eval(jsonString); // Converte string para objeto JS
                    renderizarEditor();
                    alert("Dados carregados com sucesso!");
                } catch (e) {
                    alert("Erro ao ler os dados. Verifique se o código está no formato correto.");
                }
            } else {
                alert("Não encontrei a variável 'const albums' no código.");
            }
        }

        function renderizarEditor() {
            const container = document.getElementById('listaAlbunsEditavel');
            container.innerHTML = '';
            
            dadosDiscografia.forEach((album, index) => {
                container.innerHTML += `
                    <div style="border-bottom: 1px solid #ccc; padding: 10px;">
                        <strong>${album.title}</strong> (${album.year})
                        <button onclick="editarAlbum(${index})">Editar</button>
                    </div>`;
            });
        }

        function editarAlbum(index) {
            const alb = dadosDiscografia[index];
            alert("Editando: " + alb.title + "\n(Campos de edição seriam exibidos aqui para você alterar os valores do objeto)");
            // Aqui entra a lógica de preencher os campos do formulário anterior
        }
    </script>
</body>
</html>
